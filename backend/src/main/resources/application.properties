# All secrets and environment-specific values come from environment variables.
# For local development they are loaded from the .env at the repository root
# (see .env.example). Both locations are checked so it works whether the app is
# started from backend/ or from the root.

spring.application.name=project-management

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
# Databases created before Flyway was introduced are baselined at V1 instead of failing
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:PT8H}

# HTTP / security
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.rate-limit.ai.requests-per-minute=${AI_RATE_LIMIT_PER_MINUTE:10}
server.error.include-stacktrace=never

# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o}
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# pgvector
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
# The vector_store table is created by Flyway (V2__vector_store.sql)
spring.ai.vectorstore.pgvector.initialize-schema=false

# Admin Seed (DataInitializer)
# Used ONLY on first startup if no ADMIN user exists in the database.
admin.username=${ADMIN_USERNAME}
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
admin.name=${ADMIN_NAME}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Server
server.port=${SERVER_PORT:8080}
