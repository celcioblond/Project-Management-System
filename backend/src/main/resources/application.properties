# All secrets and environment-specific values come from environment variables.
# For local development they are loaded from backend/.env (see .env.example).
# In Docker / production they are injected by the container runtime.
spring.config.import=optional:file:.env[.properties]

spring.application.name=project-management

# ─── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}

# ─── OpenAI ───────────────────────────────────────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o}
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# ─── pgvector ─────────────────────────────────────────────────────────────────
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=true

# ─── Admin Seed (DataInitializer) ─────────────────────────────────────────────
# Used ONLY on first startup if no ADMIN user exists in the database.
# ADMIN_PASSWORD has no default on purpose: the app refuses to start without it.
admin.username=${ADMIN_USERNAME:admin}
admin.email=${ADMIN_EMAIL:admin@example.com}
admin.password=${ADMIN_PASSWORD}
admin.name=${ADMIN_NAME:System Administrator}

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
