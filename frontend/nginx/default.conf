server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Project diagrams are uploaded as base64 inside JSON
    client_max_body_size 10m;

    include /etc/nginx/snippets/security-headers.conf;

    # Same-origin API: the browser never talks to the backend directly, so no CORS is needed
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OpenAI calls (chat, diagram generation) can take a while
        proxy_read_timeout 120s;
    }

    # Hashed build assets never change, cache them aggressively
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback for client-side routes
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
